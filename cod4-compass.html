<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CoD4 Compass HUD</title>
<style>*{margin:0;padding:0}body{background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight}
resize();addEventListener('resize',resize);

let bearing=0,t=0;
const enemies=[
  {a:45,dist:0.6,alive:true},{a:120,dist:0.3,alive:true},{a:210,dist:0.8,alive:true},
  {a:300,dist:0.5,alive:true},{a:170,dist:0.4,alive:true}
];

function drawCompass(){
  const cw=W*0.35,ch=40;
  const cx=W/2,cy=H*0.15;
  const x=cx-cw/2,y=cy-ch/2;

  X.fillStyle='rgba(0,0,0,0.6)';
  X.fillRect(x,y,cw,ch);
  X.strokeStyle='rgba(200,200,180,0.3)';
  X.lineWidth=1;
  X.strokeRect(x,y,cw,ch);

  X.save();
  X.beginPath();X.rect(x+2,y+2,cw-4,ch-4);X.clip();

  const dirs=['N','NE','E','SE','S','SW','W','NW'];
  const degsPerPx=cw/120;

  for(let d=-180;d<=540;d+=5){
    const offset=((d-bearing+180+360)%360-180)*degsPerPx;
    const px=cx+offset;
    if(px<x||px>x+cw)continue;

    const dirIdx=((d%360+360)%360)/45;
    if(d%45===0&&Number.isInteger(dirIdx)){
      X.font='bold 13px monospace';
      X.textAlign='center';X.textBaseline='middle';
      const label=dirs[dirIdx%8];
      X.fillStyle=label==='N'?'rgba(255,80,80,0.9)':'rgba(220,220,200,0.7)';
      X.fillText(label,px,cy);
      X.strokeStyle='rgba(200,200,180,0.4)';
      X.lineWidth=1;
      X.beginPath();X.moveTo(px,y+2);X.lineTo(px,y+8);X.stroke();
      X.beginPath();X.moveTo(px,y+ch-2);X.lineTo(px,y+ch-8);X.stroke();
    }else if(d%15===0){
      X.strokeStyle='rgba(200,200,180,0.2)';
      X.lineWidth=0.5;
      X.beginPath();X.moveTo(px,y+2);X.lineTo(px,y+5);X.stroke();
      X.beginPath();X.moveTo(px,y+ch-2);X.lineTo(px,y+ch-5);X.stroke();
    }
  }

  enemies.forEach(e=>{
    if(!e.alive)return;
    const diff=((e.a-bearing+180+360)%360-180);
    const px=cx+diff*degsPerPx;
    if(px<x||px>x+cw)return;
    const pulse=0.7+Math.sin(t*5+e.a)*0.3;
    X.save();
    X.shadowColor='rgba(255,60,30,0.8)';
    X.shadowBlur=6;
    X.fillStyle=`rgba(255,60,30,${pulse})`;
    X.beginPath();
    X.moveTo(px,cy-5);X.lineTo(px+4,cy+3);X.lineTo(px-4,cy+3);X.closePath();
    X.fill();
    X.restore();
  });

  X.restore();

  X.strokeStyle='rgba(255,255,255,0.6)';
  X.lineWidth=1.5;
  X.beginPath();X.moveTo(cx,y-2);X.lineTo(cx,y+6);X.stroke();
}

function drawHitmarker(){
  const hmT=Math.max(0,(Math.sin(t*0.5)*0.5+0.5>0.95)?1-((t%2)/0.3):0);
  if(hmT<=0)return;
  const s=12,cx=W/2,cy=H/2;
  X.save();
  X.globalAlpha=hmT;
  X.strokeStyle='#fff';X.lineWidth=2;
  X.beginPath();X.moveTo(cx-s,cy-s);X.lineTo(cx-s/3,cy-s/3);X.stroke();
  X.beginPath();X.moveTo(cx+s,cy-s);X.lineTo(cx+s/3,cy-s/3);X.stroke();
  X.beginPath();X.moveTo(cx-s,cy+s);X.lineTo(cx-s/3,cy+s/3);X.stroke();
  X.beginPath();X.moveTo(cx+s,cy+s);X.lineTo(cx+s/3,cy+s/3);X.stroke();
  X.restore();
}

function drawCrosshair(){
  const cx=W/2,cy=H/2,g=4,l=12;
  X.strokeStyle='rgba(255,255,255,0.5)';X.lineWidth=1.5;
  X.beginPath();X.moveTo(cx-g-l,cy);X.lineTo(cx-g,cy);X.stroke();
  X.beginPath();X.moveTo(cx+g,cy);X.lineTo(cx+g+l,cy);X.stroke();
  X.beginPath();X.moveTo(cx,cy-g-l);X.lineTo(cx,cy-g);X.stroke();
  X.beginPath();X.moveTo(cx,cy+g);X.lineTo(cx,cy+g+l);X.stroke();
}

const killFeed=[];
const names=['Ghost','Soap','Price','Gaz','Zakhaev','Al-Asad','Griggs','Jackson'];
const weapons=['M4A1','AK-47','M40A3','MP5','RPD','Desert Eagle','M1014'];

function maybeKill(){
  if(Math.random()<0.005&&killFeed.length<5){
    killFeed.push({
      killer:names[Math.random()*names.length|0],
      victim:names[Math.random()*names.length|0],
      weapon:weapons[Math.random()*weapons.length|0],
      life:5
    });
  }
}

function drawKillFeed(){
  X.textAlign='right';X.font='11px monospace';
  let y=60;
  for(let i=killFeed.length-1;i>=0;i--){
    const k=killFeed[i];
    k.life-=0.016;
    if(k.life<=0){killFeed.splice(i,1);continue}
    const a=Math.min(1,k.life);
    X.fillStyle=`rgba(0,0,0,${a*0.5})`;
    X.fillRect(W-300,y-10,280,16);
    X.fillStyle=`rgba(255,255,255,${a})`;
    X.fillText(`${k.killer}`,W-180,y);
    X.fillStyle=`rgba(255,80,80,${a})`;
    X.fillText(`[${k.weapon}]`,W-90,y);
    X.fillStyle=`rgba(200,200,200,${a})`;
    X.fillText(k.victim,W-22,y);
    y+=18;
  }
}

function drawAmmo(){
  X.textAlign='right';X.textBaseline='bottom';
  X.font='bold 28px monospace';X.fillStyle='rgba(255,255,255,0.8)';
  const ammo=30-(t*2|0)%30;
  X.fillText(`${ammo}`,W-80,H-30);
  X.font='16px monospace';X.fillStyle='rgba(255,255,255,0.5)';
  X.fillText('/ 120',W-25,H-33);
  X.font='10px monospace';X.fillStyle='rgba(200,200,200,0.4)';
  X.fillText('M4A1 SOPMOD',W-25,H-55);
}

function drawStance(){
  X.textAlign='left';X.textBaseline='bottom';
  X.font='10px monospace';X.fillStyle='rgba(200,200,200,0.4)';
  X.fillText('STANDING',25,H-30);
}

function drawScanlines(){
  for(let y=0;y<H;y+=3){X.fillStyle='rgba(0,0,0,0.08)';X.fillRect(0,y,W,1)}
}

function frame(){
  requestAnimationFrame(frame);
  t+=0.016;
  bearing=(bearing+0.3)%360;
  maybeKill();
  X.fillStyle='#0a0a08';X.fillRect(0,0,W,H);
  drawCompass();
  drawCrosshair();
  drawHitmarker();
  drawKillFeed();
  drawAmmo();
  drawStance();
  drawScanlines();
}
frame();
</script>
</body>
</html>
