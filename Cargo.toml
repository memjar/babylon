[package]
name = "holodeck"
version = "0.1.0"
edition = "2024"
description = "Tactical HUD rendering engine — game UI recreations via GPU-accelerated Rust"

[dependencies]
wgpu = "25"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "macros", "time"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"

[[bin]]
name = "holodeck"
path = "src/main.rs"
