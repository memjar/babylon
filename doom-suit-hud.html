<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DOOM Praetor Suit HUD</title>
<style>*{margin:0;padding:0}body{background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;function resize(){W=C.width=innerWidth;H=C.height=innerHeight}
resize();addEventListener('resize',resize);
let t=0,health=100,armor=75,ammo=24,ammoMax=40;

function drawHealthArmor(){
  const bx=40,by=H-80;
  X.font='bold 48px monospace';X.textAlign='left';
  X.save();X.shadowColor='rgba(0,200,0,0.6)';X.shadowBlur=10;
  X.fillStyle=health>30?'rgba(0,220,0,0.9)':'rgba(255,60,0,0.9)';
  X.fillText(health,bx,by);X.restore();
  X.font='14px monospace';X.fillStyle='rgba(0,200,0,0.4)';X.fillText('HEALTH',bx,by+16);

  const ax=bx+160;
  X.font='bold 48px monospace';
  X.save();X.shadowColor='rgba(60,120,255,0.6)';X.shadowBlur=10;
  X.fillStyle='rgba(60,150,255,0.9)';X.fillText(armor,ax,by);X.restore();
  X.font='14px monospace';X.fillStyle='rgba(60,120,255,0.4)';X.fillText('ARMOR',ax,by+16);
}

function drawAmmo(){
  const ax=W-180,ay=H-80;
  X.font='bold 56px monospace';X.textAlign='right';
  X.save();X.shadowColor='rgba(255,200,0,0.5)';X.shadowBlur=10;
  X.fillStyle='rgba(255,220,50,0.9)';X.fillText(ammo,ax+100,ay);X.restore();
  X.font='20px monospace';X.fillStyle='rgba(255,200,50,0.4)';
  X.fillText(`/ ${ammoMax}`,ax+140,ay);
  X.font='14px monospace';X.fillText('SUPER SHOTGUN',ax+140,ay+16);
}

function drawCompass(){
  const cx=W/2,cy=50,cw=300;
  X.fillStyle='rgba(10,10,10,0.5)';X.fillRect(cx-cw/2,cy-15,cw,30);
  X.font='10px monospace';X.textAlign='center';
  const dirs=['N','NE','E','SE','S','SW','W','NW'];
  const bearing=t*20%360;
  for(let d=-180;d<=540;d+=15){
    const off=((d-bearing+180+360)%360-180)*(cw/140);
    const px=cx+off;
    if(px<cx-cw/2||px>cx+cw/2)continue;
    if(d%45===0){
      const idx=((d%360+360)%360)/45;
      X.fillStyle=dirs[idx%8]==='N'?'rgba(255,60,30,0.8)':'rgba(200,200,200,0.5)';
      X.fillText(dirs[idx%8],px,cy+4);
    }else{
      X.fillStyle='rgba(100,100,100,0.2)';X.fillRect(px,cy-6,1,4);
    }
  }
  X.strokeStyle='rgba(255,255,255,0.5)';X.lineWidth=1;
  X.beginPath();X.moveTo(cx,cy-15);X.lineTo(cx,cy-10);X.stroke();
}

function drawDemonCount(){
  const demons=12-Math.floor(t*0.3)%12;
  X.font='10px monospace';X.textAlign='center';
  X.fillStyle='rgba(255,60,30,0.4)';
  X.fillText(`DEMONS REMAINING: ${demons}`,W/2,H-20);
}

function drawCrosshair(){
  const cx=W/2,cy=H/2;
  X.strokeStyle='rgba(0,220,0,0.5)';X.lineWidth=1.5;
  X.beginPath();X.arc(cx,cy,8,0,Math.PI*2);X.stroke();
  X.fillStyle='rgba(0,220,0,0.7)';X.fillRect(cx-1,cy-1,2,2);
  const g=12,l=6;
  X.beginPath();X.moveTo(cx-g-l,cy);X.lineTo(cx-g,cy);X.stroke();
  X.beginPath();X.moveTo(cx+g,cy);X.lineTo(cx+g+l,cy);X.stroke();
  X.beginPath();X.moveTo(cx,cy-g-l);X.lineTo(cx,cy-g);X.stroke();
}

function drawDamageVignette(){
  const dmg=Math.sin(t*0.7)*0.5+0.5>0.9?0.3:0;
  if(dmg<=0)return;
  const g=X.createRadialGradient(W/2,H/2,W*0.3,W/2,H/2,W*0.6);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(180,0,0,${dmg})`);
  X.fillStyle=g;X.fillRect(0,0,W,H);
}

function drawSlayerRune(){
  const cx=W/2,cy=H-50;
  X.save();X.globalAlpha=0.08;
  X.strokeStyle='#ff3300';X.lineWidth=1;
  const s=15;
  X.beginPath();
  for(let i=0;i<5;i++){
    const a=-Math.PI/2+i*Math.PI*4/5;
    const method=i===0?'moveTo':'lineTo';
    X[method](cx+Math.cos(a)*s,cy+Math.sin(a)*s);
  }
  X.closePath();X.stroke();X.restore();
}

function drawScanlines(){for(let y=0;y<H;y+=2){X.fillStyle='rgba(0,0,0,0.06)';X.fillRect(0,y,W,1)}}

function simulate(){
  health=80+Math.sin(t*0.5)*20|0;
  armor=60+Math.sin(t*0.3)*30|0;
  ammo=Math.max(0,24-Math.floor(t*2)%25);
}

function frame(){
  requestAnimationFrame(frame);t+=0.016;simulate();
  X.fillStyle='#050505';X.fillRect(0,0,W,H);
  drawCompass();drawCrosshair();drawHealthArmor();drawAmmo();drawDemonCount();drawDamageVignette();drawSlayerRune();drawScanlines();
}
frame();
</script>
</body>
</html>
