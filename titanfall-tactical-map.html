<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Titanfall 2 Tactical Map</title>
<style>*{margin:0;padding:0}body{background:#000;overflow:hidden}canvas{display:block}
#hud{position:fixed;top:15px;left:15px;color:rgba(0,200,255,0.6);font:10px monospace;z-index:2;letter-spacing:1px}
#hud div{margin:3px 0}
</style>
</head>
<body>
<div id="hud">
  <div>IMC TACTICAL DISPLAY</div>
  <div id="status">GRID ACTIVE — PILOTS: 6 — TITANS: 2</div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x000a10,0.012);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,500);
camera.position.set(0,25,30);camera.lookAt(0,0,0);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=0.05;
controls.maxPolarAngle=Math.PI/2.5;controls.autoRotate=true;controls.autoRotateSpeed=0.2;

const gridMat=new THREE.ShaderMaterial({
  transparent:true,side:THREE.DoubleSide,depthWrite:false,
  uniforms:{uTime:{value:0}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
    uniform float uTime;varying vec2 vUv;
    void main(){
      vec2 g=abs(fract(vUv*30.0-0.5)-0.5)/fwidth(vUv*30.0);
      float l=1.0-min(min(g.x,g.y),1.0);
      float pulse=0.5+sin(length(vUv-0.5)*20.0-uTime*2.0)*0.2;
      float fade=1.0-smoothstep(0.3,0.5,length(vUv-0.5));
      gl_FragColor=vec4(0.0,0.7,1.0,l*0.12*fade*pulse);
    }
  `
});
const grid=new THREE.Mesh(new THREE.PlaneGeometry(40,40),gridMat);
grid.rotation.x=-Math.PI/2;scene.add(grid);

function addBuilding(x,z,w,h,d){
  const geo=new THREE.BoxGeometry(w,h,d);
  const edges=new THREE.EdgesGeometry(geo);
  const mat=new THREE.LineBasicMaterial({color:0x0088cc,transparent:true,opacity:0.3});
  const line=new THREE.LineSegments(edges,mat);
  line.position.set(x,h/2,z);
  scene.add(line);
  const fill=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0x001122,transparent:true,opacity:0.15}));
  fill.position.copy(line.position);
  scene.add(fill);
}
addBuilding(-8,0,4,6,3);addBuilding(6,-5,3,4,5);addBuilding(-3,7,5,3,4);
addBuilding(10,8,3,5,3);addBuilding(-12,-6,4,7,4);addBuilding(5,3,2,8,2);
addBuilding(-6,-10,6,2,3);addBuilding(12,-2,3,3,6);

const units=[];
function addUnit(x,z,type){
  const group=new THREE.Group();
  group.position.set(x,0,z);
  if(type==='pilot'){
    const dot=new THREE.Mesh(new THREE.SphereGeometry(0.15,8,8),new THREE.MeshBasicMaterial({color:0x00ccff}));
    dot.position.y=0.3;group.add(dot);
    const ring=new THREE.Mesh(new THREE.RingGeometry(0.3,0.4,16),new THREE.MeshBasicMaterial({color:0x00ccff,transparent:true,opacity:0.3,side:THREE.DoubleSide}));
    ring.rotation.x=-Math.PI/2;ring.position.y=0.1;group.add(ring);
  }else if(type==='titan'){
    const dia=new THREE.Mesh(new THREE.OctahedronGeometry(0.4),new THREE.MeshBasicMaterial({color:0xff6600,wireframe:true}));
    dia.position.y=0.5;group.add(dia);
    const ring=new THREE.Mesh(new THREE.RingGeometry(0.6,0.8,6),new THREE.MeshBasicMaterial({color:0xff6600,transparent:true,opacity:0.2,side:THREE.DoubleSide}));
    ring.rotation.x=-Math.PI/2;ring.position.y=0.1;group.add(ring);
  }else{
    const dot=new THREE.Mesh(new THREE.SphereGeometry(0.12,8,8),new THREE.MeshBasicMaterial({color:0xff3333}));
    dot.position.y=0.3;group.add(dot);
  }
  const pillar=new THREE.Mesh(new THREE.CylinderGeometry(0.01,0.01,0.3),new THREE.MeshBasicMaterial({color:type==='enemy'?0xff3333:0x00ccff,transparent:true,opacity:0.2}));
  pillar.position.y=0.15;group.add(pillar);
  group.userData={type,vx:(Math.random()-0.5)*0.02,vz:(Math.random()-0.5)*0.02,time:Math.random()*100};
  scene.add(group);units.push(group);
}
addUnit(-5,3,'pilot');addUnit(3,-4,'pilot');addUnit(-8,-3,'pilot');
addUnit(7,6,'pilot');addUnit(0,-7,'pilot');addUnit(-4,9,'pilot');
addUnit(4,1,'titan');addUnit(-10,5,'titan');
addUnit(8,-6,'enemy');addUnit(-6,-8,'enemy');addUnit(2,8,'enemy');addUnit(11,2,'enemy');

const sweepGeo=new THREE.CircleGeometry(20,64,0,0.15);
sweepGeo.rotateX(-Math.PI/2);
const sweepMat=new THREE.MeshBasicMaterial({color:0x00aaff,transparent:true,opacity:0.05,side:THREE.DoubleSide});
const sweep=new THREE.Mesh(sweepGeo,sweepMat);sweep.position.y=0.05;scene.add(sweep);

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.0,0.5,0.15));

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  gridMat.uniforms.uTime.value=t;
  sweep.rotation.y=t*0.6;
  units.forEach(u=>{
    u.position.x+=u.userData.vx;u.position.z+=u.userData.vz;
    if(Math.abs(u.position.x)>18){u.userData.vx*=-1}
    if(Math.abs(u.position.z)>18){u.userData.vz*=-1}
    if(u.children[0])u.children[0].position.y+=Math.sin(t*2+u.userData.time)*0.002;
    if(u.userData.type==='titan'&&u.children[0])u.children[0].rotation.y=t;
  });
  controls.update();composer.render();
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
