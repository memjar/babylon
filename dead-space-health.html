<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dead Space Spine Health</title>
<style>*{margin:0;padding:0}body{background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight}
resize();addEventListener('resize',resize);

let health=1,stasis=0.8,t=0,damageFlash=0;
let healthTarget=1,phase=0,phaseTimer=0;

function drawSpine(cx,cy,segCount,value,color1,color2,segH,segW,gap){
  const totalH=segCount*(segH+gap);
  const startY=cy+totalH/2;

  for(let i=0;i<segCount;i++){
    const segVal=i/segCount;
    const sy=startY-i*(segH+gap);
    const active=value>segVal;
    const fill=active?Math.min(1,(value-segVal)*segCount):0;

    X.fillStyle='rgba(10,10,10,0.5)';
    X.beginPath();
    X.roundRect(cx-segW/2,sy-segH,segW,segH,3);
    X.fill();

    if(active){
      const ratio=1-segVal;
      const r=parseInt(color1.slice(1,3),16)*ratio+parseInt(color2.slice(1,3),16)*(1-ratio);
      const g=parseInt(color1.slice(3,5),16)*ratio+parseInt(color2.slice(3,5),16)*(1-ratio);
      const b=parseInt(color1.slice(5,7),16)*ratio+parseInt(color2.slice(5,7),16)*(1-ratio);

      const pulse=0.85+Math.sin(t*3+i*0.5)*0.15;
      const glow=active&&value<0.3?0.5+Math.sin(t*8)*0.5:1;

      X.save();
      X.shadowColor=`rgba(${r|0},${g|0},${b|0},0.8)`;
      X.shadowBlur=12;
      X.fillStyle=`rgba(${r|0},${g|0},${b|0},${0.9*fill*pulse*glow})`;
      X.beginPath();
      X.roundRect(cx-segW/2+2,sy-segH+2,segW-4,(segH-4)*fill,2);
      X.fill();
      X.restore();

      X.fillStyle=`rgba(${r|0},${g|0},${b|0},${0.3*fill*pulse})`;
      X.beginPath();
      X.roundRect(cx-segW/2-3,sy-segH-2,segW+6,segH+4,4);
      X.fill();
    }

    X.strokeStyle=active?`rgba(100,200,255,0.15)`:'rgba(40,40,40,0.3)';
    X.lineWidth=0.5;
    X.beginPath();
    X.roundRect(cx-segW/2,sy-segH,segW,segH,3);
    X.stroke();
  }

  const connW=4;
  X.fillStyle='rgba(30,30,30,0.6)';
  X.fillRect(cx-connW/2,cy-totalH/2,connW,totalH);
  X.strokeStyle='rgba(60,60,60,0.3)';
  X.lineWidth=0.5;
  X.strokeRect(cx-connW/2,cy-totalH/2,connW,totalH);
}

function drawStasisModule(cx,cy){
  const mw=30,mh=50;
  X.fillStyle='rgba(10,10,10,0.5)';
  X.beginPath();X.roundRect(cx-mw/2,cy-mh/2,mw,mh,5);X.fill();

  const fillH=mh*stasis;
  X.save();
  X.shadowColor='rgba(0,150,255,0.6)';X.shadowBlur=8;
  const g=X.createLinearGradient(0,cy+mh/2-fillH,0,cy+mh/2);
  g.addColorStop(0,'rgba(0,180,255,0.9)');
  g.addColorStop(1,'rgba(0,80,200,0.6)');
  X.fillStyle=g;
  X.beginPath();X.roundRect(cx-mw/2+3,cy+mh/2-fillH,mw-6,fillH-3,3);X.fill();
  X.restore();

  X.strokeStyle='rgba(0,150,255,0.2)';X.lineWidth=0.5;
  X.beginPath();X.roundRect(cx-mw/2,cy-mh/2,mw,mh,5);X.stroke();

  X.font='8px monospace';X.textAlign='center';
  X.fillStyle='rgba(0,180,255,0.5)';
  X.fillText('STASIS',cx,cy+mh/2+14);
}

function drawRigOutline(cx,cy){
  X.strokeStyle='rgba(40,60,80,0.15)';X.lineWidth=1;

  X.beginPath();
  X.moveTo(cx,cy-120);
  X.lineTo(cx-25,cy-80);
  X.lineTo(cx-50,cy-40);
  X.lineTo(cx-40,cy+30);
  X.lineTo(cx-20,cy+100);
  X.moveTo(cx,cy-120);
  X.lineTo(cx+25,cy-80);
  X.lineTo(cx+50,cy-40);
  X.lineTo(cx+40,cy+30);
  X.lineTo(cx+20,cy+100);
  X.stroke();

  X.beginPath();X.arc(cx,cy-135,18,0,Math.PI*2);X.stroke();
}

function drawDamageOverlay(){
  if(damageFlash>0){
    const edge=30;
    X.save();
    X.globalCompositeOperation='lighter';
    const g=X.createLinearGradient(0,0,edge,0);
    g.addColorStop(0,`rgba(255,0,0,${damageFlash*0.3})`);
    g.addColorStop(1,'rgba(255,0,0,0)');
    X.fillStyle=g;X.fillRect(0,0,edge,H);
    const g2=X.createLinearGradient(W,0,W-edge,0);
    g2.addColorStop(0,`rgba(255,0,0,${damageFlash*0.3})`);
    g2.addColorStop(1,'rgba(255,0,0,0)');
    X.fillStyle=g2;X.fillRect(W-edge,0,edge,H);
    X.restore();
    damageFlash=Math.max(0,damageFlash-0.02);
  }
}

function drawHUD(){
  X.font='10px monospace';X.textAlign='center';
  X.fillStyle='rgba(100,180,220,0.3)';
  X.fillText('RIG HEALTH MONITOR',W/2,30);
  X.fillText(`INTEGRITY: ${(health*100)|0}%`,W/2,H-20);
}

function drawScanlines(){
  for(let y=0;y<H;y+=3){X.fillStyle='rgba(0,0,0,0.06)';X.fillRect(0,y,W,1)}
}

function simulate(){
  phaseTimer+=0.016;
  if(phase===0&&phaseTimer>3){phase=1;phaseTimer=0}
  else if(phase===1){
    if(Math.random()<0.03){healthTarget=Math.max(0.1,healthTarget-0.08);damageFlash=1}
    if(phaseTimer>3){phase=2;phaseTimer=0}
  }else if(phase===2&&phaseTimer>2){healthTarget=1;phase=3;phaseTimer=0}
  else if(phase===3){
    if(health>=0.95){phase=0;phaseTimer=0}
  }
  health+=(healthTarget-health)*0.02;
  stasis=0.6+Math.sin(t*0.3)*0.3;
}

function frame(){
  requestAnimationFrame(frame);
  t+=0.016;
  simulate();
  X.fillStyle='#030506';X.fillRect(0,0,W,H);
  drawRigOutline(W/2,H/2);
  drawSpine(W/2,H/2,12,health,'#00ccff','#ff2200',20,18,4);
  drawStasisModule(W/2+60,H/2+20);
  drawDamageOverlay();
  drawHUD();
  drawScanlines();
}
frame();
</script>
</body>
</html>
