<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Halo Shield & Health Bar</title>
<style>*{margin:0;padding:0}body{background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight}
resize();addEventListener('resize',resize);

let shield=1,health=1,shieldTarget=1,healthTarget=1;
let recharging=false,rechargeDelay=0,t=0,phase=0,phaseTimer=0;
let damageFlash=0,crackle=[];

function drawBar(x,y,w,h,segments,value,color1,color2,glowColor){
  const segW=w/segments,gap=3;
  for(let i=0;i<segments;i++){
    const segStart=i/segments,segEnd=(i+1)/segments;
    const sx=x+i*(segW),sw=segW-gap;
    X.fillStyle='rgba(20,30,25,0.6)';
    X.fillRect(sx,y,sw,h);
    X.strokeStyle='rgba(100,200,150,0.2)';
    X.lineWidth=0.5;
    X.strokeRect(sx,y,sw,h);
    if(value>segStart){
      const fill=Math.min(1,(value-segStart)*segments);
      const r=parseInt(color1.slice(1,3),16)+(parseInt(color2.slice(1,3),16)-parseInt(color1.slice(1,3),16))*(1-value);
      const g=parseInt(color1.slice(3,5),16)+(parseInt(color2.slice(3,5),16)-parseInt(color1.slice(3,5),16))*(1-value);
      const b=parseInt(color1.slice(5,7),16)+(parseInt(color2.slice(5,7),16)-parseInt(color1.slice(5,7),16))*(1-value);
      const flick=recharging&&value<shieldTarget?0.7+Math.random()*0.3:1;
      X.fillStyle=`rgba(${r|0},${g|0},${b|0},${0.8*fill*flick})`;
      X.fillRect(sx+1,y+1,sw*fill-2,h-2);
      X.save();
      X.shadowColor=glowColor;
      X.shadowBlur=10;
      X.fillStyle=`rgba(${r|0},${g|0},${b|0},${0.3*fill})`;
      X.fillRect(sx+1,y+1,sw*fill-2,h-2);
      X.restore();
    }
  }
}

function drawCrackle(){
  X.save();
  X.globalCompositeOperation='lighter';
  crackle=crackle.filter(c=>{
    c.life-=0.02;
    if(c.life<=0)return false;
    X.strokeStyle=`rgba(100,200,255,${c.life*0.8})`;
    X.lineWidth=1+Math.random();
    X.beginPath();
    let px=c.x,py=c.y;
    for(let i=0;i<c.segs;i++){
      px+=Math.random()*20-10;
      py+=Math.random()*10-5;
      X.lineTo(px,py);
    }
    X.stroke();
    return true;
  });
  X.restore();
}

function spawnCrackle(x,y){
  for(let i=0;i<3;i++){
    crackle.push({x:x+Math.random()*200-100,y:y+Math.random()*20-10,segs:4+Math.random()*4|0,life:0.5+Math.random()*0.5});
  }
}

function drawDamageOverlay(){
  if(damageFlash>0){
    X.save();
    X.globalCompositeOperation='lighter';
    X.fillStyle=`rgba(255,50,30,${damageFlash*0.15})`;
    X.fillRect(0,0,W,H);
    X.restore();
    damageFlash=Math.max(0,damageFlash-0.03);
  }
}

function drawHUD(){
  const bw=W*0.5,bh=22;
  const bx=(W-bw)/2,sy=H*0.3,hy=sy+bh+12;

  X.font='10px monospace';X.fillStyle='rgba(80,200,220,0.5)';
  X.textAlign='left';
  X.fillText('SHIELD',bx,sy-6);
  X.textAlign='right';
  X.fillText(`${(shield*100)|0}%`,bx+bw,sy-6);
  drawBar(bx,sy,bw,bh,12,shield,'#44bbff','#ff4444','rgba(60,180,255,0.5)');

  X.textAlign='left';
  X.fillStyle='rgba(200,200,80,0.5)';
  X.fillText('HEALTH',bx,hy-6);
  X.textAlign='right';
  X.fillText(`${(health*100)|0}%`,bx+bw,hy-6);
  drawBar(bx,hy,bw,bh,8,health,'#cccc22','#ff2222','rgba(200,200,40,0.5)');

  X.textAlign='center';X.fillStyle='rgba(80,200,150,0.3)';
  X.font='11px monospace';
  const states=['NOMINAL','SHIELD CRITICAL','RECHARGING','TAKING FIRE'];
  let state=0;
  if(shield<0.3&&!recharging)state=1;
  else if(recharging)state=2;
  else if(damageFlash>0)state=3;
  X.fillText(states[state],W/2,hy+bh+20);
}

function drawScanlines(){
  for(let y=0;y<H;y+=4){
    X.fillStyle='rgba(0,0,0,0.1)';
    X.fillRect(0,y,W,1);
  }
}

function drawFrame(){
  const bx=(W-W*0.5)/2,sy=H*0.3;
  X.strokeStyle='rgba(60,180,200,0.15)';
  X.lineWidth=1;
  X.strokeRect(bx-20,sy-30,W*0.5+40,100);
  for(let i=0;i<4;i++){
    const corners=[[bx-20,sy-30],[bx+W*0.5+20,sy-30],[bx-20,sy+70],[bx+W*0.5+20,sy+70]];
    const [cx,cy]=corners[i];
    const dx=i%2===0?1:-1,dy=i<2?1:-1;
    X.strokeStyle='rgba(60,180,200,0.4)';
    X.beginPath();X.moveTo(cx,cy+dy*15);X.lineTo(cx,cy);X.lineTo(cx+dx*15,cy);X.stroke();
  }
}

function simulate(){
  phaseTimer+=0.016;
  if(phase===0&&phaseTimer>2){phase=1;phaseTimer=0}
  else if(phase===1){
    if(phaseTimer<1.5){
      if(Math.random()<0.1){
        shieldTarget=Math.max(0,shieldTarget-0.15);
        damageFlash=1;
        spawnCrackle((W-W*0.5)/2+Math.random()*W*0.5,H*0.3);
      }
    }else{phase=2;phaseTimer=0;rechargeDelay=1.5}
  }else if(phase===2){
    rechargeDelay-=0.016;
    if(rechargeDelay<=0){recharging=true;shieldTarget=1}
    if(shield>=0.99){recharging=false;phase=3;phaseTimer=0}
  }else if(phase===3&&phaseTimer>1.5){phase=4;phaseTimer=0}
  else if(phase===4){
    if(phaseTimer<2){
      if(Math.random()<0.08){
        shieldTarget=Math.max(0,shieldTarget-0.12);
        if(shield<=0.05)healthTarget=Math.max(0.1,healthTarget-0.1);
        damageFlash=1;
        spawnCrackle((W-W*0.5)/2+Math.random()*W*0.5,H*0.3);
      }
    }else{phase=5;phaseTimer=0;rechargeDelay=2}
  }else if(phase===5){
    rechargeDelay-=0.016;
    if(rechargeDelay<=0){recharging=true;shieldTarget=1;healthTarget=1}
    if(shield>=0.99&&health>=0.99){recharging=false;phase=0;phaseTimer=0}
  }

  const rate=recharging?0.008:0.05;
  shield+=(shieldTarget-shield)*rate;
  health+=(healthTarget-health)*0.01;
  if(recharging&&Math.random()<0.05)spawnCrackle((W-W*0.5)/2+Math.random()*W*0.5,H*0.3);
}

function frame(){
  requestAnimationFrame(frame);
  t+=0.016;
  simulate();
  X.fillStyle='#000';X.fillRect(0,0,W,H);
  drawFrame();
  drawHUD();
  drawCrackle();
  drawDamageOverlay();
  drawScanlines();
}
frame();
</script>
</body>
</html>
