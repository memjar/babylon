<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mass Effect Galaxy Map</title>
<style>*{margin:0;padding:0}body{background:#000;overflow:hidden}canvas{display:block}
#info{position:fixed;bottom:20px;left:20px;color:rgba(200,140,40,0.7);font:11px monospace;z-index:2;letter-spacing:1px}
</style>
</head>
<body>
<div id="info">GALAXY MAP — NAVIGATE WITH MOUSE</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,2000);
camera.position.set(0,80,120);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=0.05;
controls.autoRotate=true;controls.autoRotateSpeed=0.15;

const starCount=3000;
const sGeo=new THREE.BufferGeometry();
const sPos=new Float32Array(starCount*3);
const sCol=new Float32Array(starCount*3);
for(let i=0;i<starCount;i++){
  const theta=Math.random()*Math.PI*2;
  const phi=Math.acos(2*Math.random()-1);
  const r=200+Math.random()*600;
  sPos[i*3]=r*Math.sin(phi)*Math.cos(theta);
  sPos[i*3+1]=r*Math.sin(phi)*Math.sin(theta);
  sPos[i*3+2]=r*Math.cos(phi);
  const c=0.5+Math.random()*0.5;
  sCol[i*3]=c*0.8;sCol[i*3+1]=c*0.85;sCol[i*3+2]=c;
}
sGeo.setAttribute('position',new THREE.BufferAttribute(sPos,3));
sGeo.setAttribute('color',new THREE.BufferAttribute(sCol,3));
scene.add(new THREE.Points(sGeo,new THREE.PointsMaterial({size:0.8,vertexColors:true,transparent:true,opacity:0.6})));

const nebGeo=new THREE.BufferGeometry();
const nebCount=800;
const nPos=new Float32Array(nebCount*3);
for(let i=0;i<nebCount;i++){
  const a=Math.random()*Math.PI*2;
  const r=5+Math.random()*50;
  const spread=r*0.15;
  nPos[i*3]=Math.cos(a)*r+(Math.random()-0.5)*spread*3;
  nPos[i*3+1]=(Math.random()-0.5)*spread;
  nPos[i*3+2]=Math.sin(a)*r+(Math.random()-0.5)*spread*3;
}
nebGeo.setAttribute('position',new THREE.BufferAttribute(nPos,3));
scene.add(new THREE.Points(nebGeo,new THREE.PointsMaterial({size:3,color:0x331166,transparent:true,opacity:0.15})));

const gridGeo=new THREE.RingGeometry(5,60,64);
gridGeo.rotateX(-Math.PI/2);
const gridMat=new THREE.ShaderMaterial({
  transparent:true,side:THREE.DoubleSide,depthWrite:false,
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`varying vec2 vUv;void main(){
    vec2 g=abs(fract(vUv*15.0-0.5)-0.5)/fwidth(vUv*15.0);
    float l=1.0-min(min(g.x,g.y),1.0);
    float r=smoothstep(1.0,0.3,length(vUv-0.5)*2.0);
    gl_FragColor=vec4(0.8,0.5,0.15,l*0.08*r);
  }`
});
scene.add(new THREE.Mesh(gridGeo,gridMat));

const systems=[
  {name:'Sol',x:0,y:0,z:0,color:0xffcc44,size:0.8},
  {name:'Arcturus',x:15,y:2,z:-10,color:0xff8833,size:1.2},
  {name:'Citadel',x:-20,y:1,z:5,color:0x44aaff,size:1.5},
  {name:'Omega',x:30,y:-1,z:20,color:0xff4444,size:1.0},
  {name:'Illium',x:-10,y:3,z:-25,color:0xaa66ff,size:0.9},
  {name:'Tuchanka',x:25,y:-2,z:-15,color:0xcc8844,size:0.7},
  {name:'Rannoch',x:-30,y:0,z:-20,color:0x66ccaa,size:0.8},
  {name:'Palaven',x:10,y:1,z:30,color:0x4488cc,size:1.1},
  {name:'Thessia',x:-15,y:2,z:15,color:0x8866ff,size:1.3},
  {name:'Sur\'Kesh',x:5,y:-1,z:-35,color:0x44cc66,size:0.7},
  {name:'Earth',x:2,y:0,z:1,color:0x4488ff,size:0.6},
  {name:'Ilos',x:-40,y:3,z:-5,color:0xccaa33,size:0.5},
];

const sysGroup=new THREE.Group();
systems.forEach(s=>{
  const geo=new THREE.SphereGeometry(s.size,16,16);
  const mat=new THREE.MeshBasicMaterial({color:s.color});
  const mesh=new THREE.Mesh(geo,mat);
  mesh.position.set(s.x,s.y,s.z);
  sysGroup.add(mesh);

  const ringG=new THREE.RingGeometry(s.size+0.3,s.size+0.5,32);
  const ringM=new THREE.MeshBasicMaterial({color:s.color,transparent:true,opacity:0.2,side:THREE.DoubleSide});
  const ring=new THREE.Mesh(ringG,ringM);
  ring.position.copy(mesh.position);
  ring.rotation.x=Math.PI/2;
  sysGroup.add(ring);

  const pillarG=new THREE.CylinderGeometry(0.03,0.03,Math.abs(s.y)+0.5);
  const pillarM=new THREE.MeshBasicMaterial({color:s.color,transparent:true,opacity:0.15});
  const pillar=new THREE.Mesh(pillarG,pillarM);
  pillar.position.set(s.x,s.y/2-0.25,s.z);
  sysGroup.add(pillar);
});

const routes=[[0,10],[10,1],[1,2],[2,8],[8,4],[4,6],[2,7],[7,3],[3,5],[5,9],[9,11]];
routes.forEach(([a,b])=>{
  const sa=systems[a],sb=systems[b];
  const pts=[new THREE.Vector3(sa.x,sa.y,sa.z),new THREE.Vector3(sb.x,sb.y,sb.z)];
  const geo=new THREE.BufferGeometry().setFromPoints(pts);
  const mat=new THREE.LineBasicMaterial({color:0xcc8833,transparent:true,opacity:0.15});
  sysGroup.add(new THREE.Line(geo,mat));
});
scene.add(sysGroup);

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.2,0.8,0.15));

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  sysGroup.children.forEach((c,i)=>{
    if(c.isMesh&&c.geometry.type==='SphereGeometry'){
      c.position.y+=Math.sin(t*0.5+i)*0.001;
    }
  });
  controls.update();
  composer.render();
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
